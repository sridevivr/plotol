[project]
name = "signalforge"
version = "0.1.0"
description = "Claude research agent + personalization service for the SignalForge GTM engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "anthropic>=0.39.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["pipeline"]
include = ["research*", "personalization*"]

[tool.ruff]
line-length = 100
target-version = "py311"
